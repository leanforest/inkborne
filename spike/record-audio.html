<!doctype html>
<meta charset="utf-8">
<title>录音轨</title>
<!-- 按短视频成片的时间点，实时演奏游戏自己的程序化音频（古琴 / 箫 / 水 / 风 / 雨 / 音效），无损录成 WAV。
     时间点对应 promo/src/ShanShui.tsx 的场景排布（30fps）。点页面任意处开始；完成后存到 video/bgm.wav。 -->
<body style="margin:0;background:#f2ede2;font:20px KaiTi,serif;display:flex;align-items:center;justify-content:center;height:100vh">点击开始录音轨</body>
<script type="module">
import { createAudio } from './audio.js';

const F = (f) => f / 30;                       // 帧 → 秒
const S = { Hook: 0, Intro: 95, Dawn: 330, Walk: 453, Fish: 537, Board: 720, Row: 828, Rain: 933, Away: 1053, End: 1148 };
const TOTAL = F(1348);
const at = (scene, sec) => F(S[scene]) + sec;

// [时间(秒), 动作]
const EVENTS = [
  [0, (a) => { a.setMood('清晨'); a.setWind(0.7, 80); a.setWater(0.3); a.setBirds(false); }],
  [0.05, (a) => a.sfx.swordUp()],
  [at('Intro', 0), (a) => { a.setWind(0.12, 0); a.setWater(0.2); }],
  [at('Intro', F(96)), (a) => { a.sfx.toggle(); a.setWind(0.45, 60); }],
  [at('Intro', 6.0), (a) => { a.setWind(0.05, 0); a.setWater(0.8); a.setBirds(true); }],
  [at('Dawn', 0), (a) => { a.setWind(0, 0); a.setWater(0.7); }],
  [at('Fish', 0), (a) => { a.setMood('正午'); a.setWater(1); }],
  [at('Fish', 0.2), (a) => a.sfx.cast()],
  [at('Fish', 0.9), (a) => a.sfx.plop()],
  [at('Fish', 1.5), (a) => a.sfx.nibble()],
  [at('Fish', 2.0), (a) => a.sfx.nibble()],
  [at('Fish', 2.5), (a) => a.sfx.bite()],
  [at('Fish', 2.8), (a) => a.sfx.splash()],
  [at('Fish', F(120)), (a) => a.sfx.chime()],
  [at('Board', 1.9), (a) => a.sfx.board()],
  [at('Row', 0.3), (a) => a.sfx.oar()],
  [at('Row', 1.4), (a) => a.sfx.oar()],
  [at('Row', 2.5), (a) => a.sfx.oar()],
  [at('Row', 3.6), (a) => a.sfx.oar()],
  [at('Rain', -0.6), (a) => { a.setMood('黄昏'); a.setRain(1); a.setBirds(false); }],
  [at('Rain', 0.8), (a) => a.sfx.oar()],
  [at('Rain', 2.4), (a) => a.sfx.oar()],
  [at('Away', -0.4), (a) => a.setRain(0)],
  [at('Away', 0.3), (a) => { a.sfx.swordUp(); a.setWind(0.5, 40); }],
  [at('End', 0), (a) => { a.setWind(0.1, 0); a.setWater(0.4); }],
  [at('End', F(124)), (a) => a.sfx.chime()],
];

async function run() {
  document.body.textContent = '录制中……';
  const audio = createAudio();
  audio.start();
  // 采样器：总线 → ScriptProcessor 收集 PCM（静音接到输出，保证持续拉流）
  const ac = audio.tap(null);
  const proc = ac.createScriptProcessor(4096, 2, 2);
  const L = [], R = [];
  let rec = false;
  proc.onaudioprocess = (e) => { if (!rec) return; L.push(new Float32Array(e.inputBuffer.getChannelData(0))); R.push(new Float32Array(e.inputBuffer.getChannelData(1))); };
  const mute = ac.createGain(); mute.gain.value = 0; proc.connect(mute); mute.connect(ac.destination);
  audio.tap(proc);
  await ac.resume();
  // 总音量启动时 3 秒渐入，先等它到位、环境声起来，再开始计时（演奏时间 = 录音时间）
  await new Promise((r) => setTimeout(r, 3300));
  rec = true;
  const t0 = ac.currentTime;
  // 用 Worker 计时：后台标签页里主线程定时器会被节流到 1 秒一次
  const w = new Worker(URL.createObjectURL(new Blob(['setInterval(() => postMessage(0), 10)'], { type: 'text/javascript' })));
  let i = 0;
  await new Promise((done) => {
    w.onmessage = () => {
      const t = ac.currentTime - t0;
      while (i < EVENTS.length && EVENTS[i][0] <= t) EVENTS[i++][1](audio);
      document.title = `REC ${t.toFixed(1)}/${TOTAL.toFixed(1)}`;
      if (t >= TOTAL + 0.3) { w.terminate(); done(); }
    };
  });
  rec = false;
  // 编码 WAV（16 位立体声）
  const n = L.reduce((a, b) => a + b.length, 0), sr = ac.sampleRate;
  const buf = new ArrayBuffer(44 + n * 4), v = new DataView(buf);
  const ws = (o, s) => [...s].forEach((c, k) => v.setUint8(o + k, c.charCodeAt(0)));
  ws(0, 'RIFF'); v.setUint32(4, 36 + n * 4, true); ws(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 2, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 4, true); v.setUint16(32, 4, true); v.setUint16(34, 16, true); ws(36, 'data'); v.setUint32(40, n * 4, true);
  let o = 44;
  for (let b = 0; b < L.length; b++) for (let k = 0; k < L[b].length; k++) {
    v.setInt16(o, Math.max(-1, Math.min(1, L[b][k])) * 32767, true); v.setInt16(o + 2, Math.max(-1, Math.min(1, R[b][k])) * 32767, true); o += 4;
  }
  await fetch('/__clip?name=bgm.wav', { method: 'POST', body: buf });
  document.title = `AUDIO DONE ${(n / sr).toFixed(1)}s ${sr}Hz`;
  document.body.textContent = '完成';
}
window.__startRec = run;
addEventListener('click', run, { once: true });
</script>
